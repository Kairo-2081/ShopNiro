name: Database migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect status, check drift, adopt a reviewed existing schema, apply migrations, or record a clean baseline
        required: true
        type: choice
        options:
          - status
          - drift
          - adopt
          - apply
          - baseline
        default: status

permissions:
  actions: read
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    services:
      # A throwaway database the drift check builds from the migration files. Same major version as
      # Supabase so catalog output is comparable.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reference
          POSTGRES_USER: reference
          POSTGRES_PASSWORD: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reference -d reference"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
      REFERENCE_DATABASE_URL: postgresql://reference:reference@127.0.0.1:5432/reference
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require a recent successful backup before adoption or apply
        if: inputs.mode == 'adopt' || inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          recent_backup="$(gh run list --workflow backup.yml --limit 1 --json conclusion,createdAt)"
          cutoff="$(date -u -d '24 hours ago' +%s)"
          if ! jq -e --argjson cutoff "$cutoff" \
            'length == 1 and .[0].conclusion == "success" and (.[0].createdAt | fromdateiso8601) >= $cutoff' \
            <<< "$recent_backup" >/dev/null; then
            echo "::error::The latest backup.yml run did not succeed within the last 24 hours."
            exit 1
          fi

      - name: Show migration status
        if: inputs.mode == 'status'
        run: npm run migrate:status

      - name: Build a reference database from the migration files
        if: inputs.mode == 'drift' || inputs.mode == 'baseline'
        env:
          DATABASE_URL: ${{ env.REFERENCE_DATABASE_URL }}
        run: npm run migrate

      - name: Compare the live database with the reference
        if: inputs.mode == 'drift' || inputs.mode == 'baseline'
        run: npm run migrate:drift -- --reference "$REFERENCE_DATABASE_URL" --full

      - name: Apply pending migrations
        if: inputs.mode == 'apply'
        run: npm run migrate

      - name: Record reviewed existing schema as the adoption starting point
        if: inputs.mode == 'adopt'
        run: npm run migrate -- --adopt 0001

      - name: Record the existing schema baseline (only reached when the drift check passed)
        if: inputs.mode == 'baseline'
        run: npm run migrate -- --baseline 0001
