name: Production schema watch

# Read-only. Asks the live app to compare its own database with the schema the migration files build
# (db/expected-schema.json) and to check that every shipped migration is recorded. The app already holds the
# database connection, so this workflow needs no database credential and no Environment: it uses the same
# APP_URL and CRON_SECRET repository secrets as the scheduled jobs. A failed run is the alert: GitHub emails
# the repository's watchers.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare the live schema with the migration files
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_URL" || -z "$CRON_SECRET" ]]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be configured."
            exit 1
          fi
          status=$(curl -sS --retry 3 --retry-delay 20 --retry-all-errors -m 60 -o result.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/schema-drift")
          echo "HTTP $status"
          # The body names schema objects only, never data or credentials.
          jq . result.json || cat result.json
          if [[ "$status" == "200" ]]; then
            echo "No drift: the live schema matches the migration files."
          elif [[ "$status" == "409" ]]; then
            echo "::error::Schema drift. See docs/runbooks/schema-drift-alert.md."
            exit 1
          else
            echo "::error::The schema watch could not run (HTTP $status): app down, wrong APP_URL/CRON_SECRET, or db/expected-schema.json not deployed."
            exit 1
          fi
