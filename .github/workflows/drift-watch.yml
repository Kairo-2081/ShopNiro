name: Production schema watch

# Read-only. Builds a reference database from the migration files and compares production with it every
# day, so a schema change made outside the migration runner is noticed within a day instead of at the
# next deploy. A failed run is the alert: GitHub emails the repository's watchers.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    # The production database URL is stored in this Environment. If the Environment requires reviewers,
    # each scheduled run waits for approval; remove that rule or move the secret to a repository secret
    # to let it run unattended.
    environment: production
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reference
          POSTGRES_USER: reference
          POSTGRES_PASSWORD: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reference -d reference"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LIVE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
      REFERENCE_DATABASE_URL: postgresql://reference:reference@127.0.0.1:5432/reference
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build a reference database from the migration files
        env:
          DATABASE_URL: ${{ env.REFERENCE_DATABASE_URL }}
        run: npm run migrate

      - name: Check the live schema against the recorded adoption fingerprint and migration history
        env:
          DATABASE_URL: ${{ env.LIVE_DATABASE_URL }}
        run: npm run migrate:status

      - name: Compare the live database with the reference
        env:
          DATABASE_URL: ${{ env.LIVE_DATABASE_URL }}
        run: npm run migrate:drift -- --reference "$REFERENCE_DATABASE_URL" --full
