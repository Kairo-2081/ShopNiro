name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopniro_test
          POSTGRES_USER: shopniro_test
          POSTGRES_PASSWORD: shopniro_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shopniro_test -d shopniro_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shopniro_test:shopniro_test_password@127.0.0.1:5432/shopniro_test
      JWT_SECRET: test-test-test-test-test-test-test-test
      CRON_SECRET: test-test-test-test-test-test-test-test
      SSLCOMMERZ_IPN_TOKEN: test-ipn-token-1234567890abcdef
      SSLCOMMERZ_STORE_ID: test-store-id
      SSLCOMMERZ_STORE_PASSWORD: test-store-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database
        run: npm run migrate

      - name: Lint TypeScript
        run: npm run lint

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log || {
            # Surface failing tests as annotations so they are visible without downloading logs.
            grep -E "^\s*not ok|^\s+(error|expected|actual|message):|Error:" test-output.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Build bundle
        run: npm run build

      # The job runs with NODE_ENV=test, which builds React's larger development bundle, so measure a production build.
      - name: Check bundle budget
        run: |
          NODE_ENV=production npm run build
          node scripts/check-bundle-budget.mjs

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopniro_e2e
          POSTGRES_USER: shopniro_test
          POSTGRES_PASSWORD: shopniro_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shopniro_test -d shopniro_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://shopniro_test:shopniro_test_password@127.0.0.1:5432/shopniro_e2e
      JWT_SECRET: test-test-test-test-test-test-test-test
      CRON_SECRET: test-test-test-test-test-test-test-test
      SSLCOMMERZ_IPN_TOKEN: test-ipn-token-1234567890abcdef
      SSLCOMMERZ_STORE_ID: test-store-id
      SSLCOMMERZ_STORE_PASSWORD: test-store-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database
        run: npm run migrate

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run browser checkout tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopniro_a11y
          POSTGRES_USER: shopniro_test
          POSTGRES_PASSWORD: shopniro_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shopniro_test -d shopniro_a11y"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://shopniro_test:shopniro_test_password@127.0.0.1:5432/shopniro_a11y
      JWT_SECRET: test-test-test-test-test-test-test-test
      CRON_SECRET: test-test-test-test-test-test-test-test
      SSLCOMMERZ_IPN_TOKEN: test-ipn-token-1234567890abcdef
      SSLCOMMERZ_STORE_ID: test-store-id
      SSLCOMMERZ_STORE_PASSWORD: test-store-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database
        run: npm run migrate

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run accessibility browser tests
        run: npm run test:a11y -- --project=desktop

      - name: Build production app for Lighthouse
        run: npm run build

      - name: Check Lighthouse accessibility score
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/shopniro-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --max-time 1 --fail --silent http://127.0.0.1:4174/ >/dev/null
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath());")" \
            npx lighthouse http://127.0.0.1:4174 \
              --only-categories=accessibility --form-factor=mobile \
              --output=json --output-path=/tmp/shopniro-lighthouse-a11y.json \
              --chrome-flags="--headless=new --no-sandbox" --no-enable-error-reporting
          npm run test:lighthouse:a11y -- /tmp/shopniro-lighthouse-a11y.json

      - name: Upload accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
