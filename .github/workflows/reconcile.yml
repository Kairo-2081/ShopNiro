name: Nightly payment reconciliation

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconcile payments
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_URL" || -z "$CRON_SECRET" ]]; then
            echo "APP_URL and CRON_SECRET repository secrets must be configured."
            exit 1
          fi
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          http_code="$(curl -sS --max-time 600 --retry 2 --retry-delay 30 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o "$body_file" -w '%{http_code}' \
            "${APP_URL%/}/api/cron/reconcile-payments")"
          response="$(cat "$body_file")"
          if [[ "$http_code" != "200" ]]; then
            echo "Reconciliation endpoint returned HTTP ${http_code}."
            api_error="$(jq -er '.error // empty' "$body_file" 2>/dev/null | cut -c1-300 || true)"
            if [[ -n "$api_error" ]]; then
              echo "Endpoint error: ${api_error}"
            fi
            case "$http_code" in
              401) echo "Hint: CRON_SECRET in GitHub does not match CRON_SECRET on the app (the app that APP_URL points at)." ;;
              503) echo "Hint: the app has no CRON_SECRET set, or its database is not ready (check /api/ready)." ;;
              409) echo "Hint: another reconciliation run is still in progress; try again shortly." ;;
            esac
            exit 1
          fi
          printf '%s\n' "$response" | node scripts/report-payment-reconciliation.mjs
