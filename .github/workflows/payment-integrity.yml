name: Payment Integrity

concurrency:
  group: payment-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopniro_test
          POSTGRES_PASSWORD: shopniro_test_password
          POSTGRES_DB: shopniro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopniro_test -d shopniro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Test Database
        env:
          DATABASE_URL: postgresql://shopniro_test:shopniro_test_password@127.0.0.1:5432/shopniro_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql

      - name: Run Payment Integrity Tests
        env:
          DATABASE_URL: postgresql://shopniro_test:shopniro_test_password@127.0.0.1:5432/shopniro_test
          JWT_SECRET: payment-integrity-test-secret-at-least-32-characters
          NODE_ENV: test
        run: npm test

      - name: Type Check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Scan Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
