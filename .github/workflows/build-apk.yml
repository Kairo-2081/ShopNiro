name: Build Android APK and Windows App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  payment-integrity:
    uses: ./.github/workflows/payment-integrity.yml

  build-android:
    needs: [ci, payment-integrity]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode and Verify Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          STORE_PASS=$(echo -n "$STORE_PASS" | tr -d '\r\n')
          KEY_PASS=$(echo -n "$KEY_PASS" | tr -d '\r\n')
          KEY_ALIAS=$(echo -n "$KEY_ALIAS" | tr -d '\r\n')

          MISSING=0
          for v in KEYSTORE_BASE64 STORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is empty or missing"
              MISSING=1
            else
              echo "$v is set"
            fi
          done
          [ "$MISSING" = "0" ] || exit 1

          KEYSTORE_PATH="$RUNNER_TEMP/shopniro-release-key.jks"
          if ! echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_PATH"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          echo "Decoded keystore size: $(wc -c < "$KEYSTORE_PATH") bytes"
          [ -s "$KEYSTORE_PATH" ] || { echo "::error::Decoded keystore is empty"; exit 1; }

          if ! OUT=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" 2>&1); then
            echo "::error::keytool validation failed. Check RELEASE_STORE_PASSWORD and RELEASE_KEY_ALIAS in GitHub Secrets."
            echo "$OUT"
            exit 1
          fi
          echo "Keystore OK, alias found"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Release APK (unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and Sign APK
        env:
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          STORE_PASS=$(echo -n "$STORE_PASS" | tr -d '\r\n')
          KEY_PASS=$(echo -n "$KEY_PASS" | tr -d '\r\n')
          KEY_ALIAS=$(echo -n "$KEY_ALIAS" | tr -d '\r\n')

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"

          APK_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$(find "$APK_DIR" -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED_APK" || { echo "::error::No APK found in $APK_DIR"; exit 1; }
          echo "Found APK: $UNSIGNED_APK"

          mkdir -p android-release
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$STORE_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out android-release/ShopNiro.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose android-release/ShopNiro.apk

      - name: Remove Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/shopniro-release-key.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android-release/ShopNiro.apk
          if-no-files-found: error

  build-windows:
    needs: [ci, payment-integrity]
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer and Portable App
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-windows/*.exe
          if-no-files-found: error

  publish-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-artifacts
          merge-multiple: true

      - name: Publish APK and Windows executables
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}